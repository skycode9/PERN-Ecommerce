services:
  - type: web
    name: pern-ecom-api
    runtime: docker
    plan: free
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /health
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "3"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: DEMO_ADMIN_EMAIL
        value: admin.demo@example.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox

  - type: web
    name: pern-ecom
    runtime: docker
    plan: free
    dockerContext: ./client
    dockerfilePath: ./client/Dockerfile
    buildFilter:
      paths:
        - client/**
    envVars:
      # public url of the api service, e.g. https://pern-ecom-api.onrender.com
      - key: API_UPSTREAM
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
      - key: VITE_DEMO_MODE
        value: "true"
